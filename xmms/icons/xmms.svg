<?xml version="1.0" encoding="UTF-8"?>
<!-- XMMS's icon, drawn for 48 pixels. Every size of it from 32 pixels up is this drawing, scaled;
     below that the icon is the headphones, xmms-small.svg.
     It is drawn after the 48 pixel icon wmxmms had (wmxmms/wmxmms.xpm of XMMS 1.2.11), which was too
     small to be made larger: the plate, the lamp and the letters are where they were there.
     Copyright (C) 2026 The CGTK authors. Under XMMS's licence, the GNU General Public License,
     version 2 or later: see COPYING. -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
<defs>
<linearGradient id="steel" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="48" y2="48">
<stop offset="0" stop-color="#688a9f"/>
<stop offset="0.45" stop-color="#384a56"/>
<stop offset="0.95" stop-color="#050708"/>
<stop offset="1" stop-color="#040406"/>
</linearGradient>
<linearGradient id="lamp" gradientUnits="userSpaceOnUse" x1="0" y1="5" x2="0" y2="7">
<stop offset="0" stop-color="#d00a0c"/>
<stop offset="1" stop-color="#a00204"/>
</linearGradient>
</defs>
<rect width="48" height="48" fill="url(#steel)"/>

<!-- the lamp in its bezel -->
<rect x="1" y="3" width="15" height="6" fill="#4a4e54"/>
<path d="M1,9 H16 V3 H15 V8 H1 Z" fill="#a6a4a6"/>
<rect x="2" y="4" width="13" height="4" fill="#3c4046"/>
<rect x="3" y="5" width="11" height="2" fill="url(#lamp)"/>

